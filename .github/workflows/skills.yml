name: Skills

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      tag:
        description: Webhose/skills release to pin, for example v1.2.0
        required: true

permissions:
  contents: read

jobs:
  # skills/ must be exactly the pinned Webhose/skills release, and every manifest must carry the same version.
  check:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/sync-skills.sh
      - name: skills/ matches the pinned release (edit skills in Webhose/skills, not here)
        run: git add -A skills SKILLS_VERSION && git diff --cached --exit-code
      - name: One version in every manifest
        run: test "$(jq -r .version plugin.json .cursor-plugin/plugin.json .claude-plugin/plugin.json .grok-plugin/plugin.json gemini-extension.json | sort -u | wc -l)" = 1

  # Opens a pull request that pins a new skills release and raises the plugin's patch version, so clients see an update.
  # A release that changes none of the skills this plugin carries opens nothing: the pin stays where it is.
  # ponytail: checks do not start on a pull request opened with the workflow token; the content comes from the same script
  # the check runs. Merging stays manual, because marketplaces review every plugin update.
  bump:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/sync-skills.sh "$TAG"
      - name: Open the pull request
        run: |
          if [ -z "$(git status --porcelain -- skills)" ]; then echo "$TAG changes no skill of this plugin"; exit 0; fi
          old="$(jq -r .version plugin.json)"
          new="${old%.*}.$(( ${old##*.} + 1 ))"
          sed -i "s/\"version\": \"$old\"/\"version\": \"$new\"/" plugin.json .cursor-plugin/plugin.json .claude-plugin/plugin.json .grok-plugin/plugin.json gemini-extension.json
          test "$(jq -r .version plugin.json .cursor-plugin/plugin.json .claude-plugin/plugin.json .grok-plugin/plugin.json gemini-extension.json | sort -u)" = "$new"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "skills-$TAG"
          git add -A
          git commit -m "$new: skills $TAG"
          git push --force origin "skills-$TAG"
          gh pr create --base master --head "skills-$TAG" --title "$new: skills $TAG" --body "Pins [Webhose/skills $TAG](https://github.com/Webhose/skills/releases/tag/$TAG) and raises the plugin version to $new. Generated by scripts/sync-skills.sh."
